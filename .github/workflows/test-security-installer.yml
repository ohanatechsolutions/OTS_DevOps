name: Test Security Onboarding Installer
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_universal_security.py'
      - 'tests/test_install_universal_security.py'
      - '.github/workflows/install-universal-security.yml'
      - '.github/workflows/test-security-installer.yml'
  pull_request:
    paths:
      - 'scripts/install_universal_security.py'
      - 'tests/test_install_universal_security.py'
      - '.github/workflows/install-universal-security.yml'
      - '.github/workflows/test-security-installer.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile installer and execute mocked GitHub API tests
        run: |
          python -m py_compile scripts/install_universal_security.py
          python -m unittest discover -s tests -p 'test_install_universal_security.py' -v
