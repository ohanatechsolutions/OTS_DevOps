name: OTS Reusable Security Baseline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy filesystem baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

  trufflehog:
    name: TruffleHog credential history
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for verified and unknown credentials
        uses: trufflesecurity/trufflehog@9529cc6177f50ed15e29cb886547749627e5f96e
        with:
          path: ./
          extra_args: --results=verified,unknown

  semgrep:
    name: Semgrep CE source scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect language coverage
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          tracked = {p.suffix for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts}
          supported = {'.py', '.js', '.jsx', '.ts', '.tsx', '.go', '.cs', '.java', '.rb', '.php', '.rs', '.sh', '.yml', '.yaml', '.json', '.tf'}
          present = sorted(tracked & supported)
          unsupported = sorted(x for x in tracked - supported if x and x not in {'.md','.png','.jpg','.ico','.svg','.lock','.txt','.gitignore','.sha256'})
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Semgrep coverage\nSupported file extensions detected: ' + (', '.join(present) or 'none') + '\n\n')
              f.write('Other extensions requiring separate review: ' + (', '.join(unsupported) or 'none') + '\n\n')
          PY
      - name: Install Semgrep CE
        run: python -m pip install --disable-pip-version-check 'semgrep==1.186.0'
      - name: Run Semgrep rules (local analysis)
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: semgrep scan --config p/security-audit --metrics off --error --severity ERROR .

  quality:
    name: Applicable tests and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests, compilation and lint
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o -name '*.py' -print -quit | grep -q .; then
            python -m compileall -q .
            python -m pip install --disable-pip-version-check 'ruff==0.14.5'
            ruff check --select E9,F63,F7,F82 .
            if ! ruff check --select E4,E7 .; then
              echo 'Existing formatting/style violations detected (E4/E7). Review and remediate; correctness lint remains blocking.' >> "$GITHUB_STEP_SUMMARY"
            fi
            case "$GITHUB_REPOSITORY" in
              ohanatechsolutions/TanDM)
                python -m pip install -r requirements-dev.txt
                python -m pytest -q tests -k 'not browser'
                ;;
              ohanatechsolutions/OTS-Jarvis)
                python -m pip install -e . 'pytest==9.0.2'
                python -m pytest -q tests/test_jarvis.py
                ;;
              ohanatechsolutions/OTS-Security-Suite)
                python -m unittest discover -s tools -p 'test_*.py'
                PYTHONPATH=white_engine python -m unittest discover -s white_engine/tests -p 'test_*.py'
                ;;
              *) echo 'Python tests: N/A (no project-specific Python suite configured)' ;;
            esac
          else
            echo 'Python checks: N/A (no Python sources)'
          fi
      - name: Go unit tests and vet
        if: github.event.repository.name == 'OTS-Security-Suite'
        shell: bash
        run: |
          set -euo pipefail
          cd scanner
          go test ./...
          go vet ./...
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          if command -v node >/dev/null; then
            find . -path './.git' -prune -o -type f \( -name '*.js' -o -name '*.cjs' \) -print0 |
              while IFS= read -r -d '' file; do node --check "$file"; done
          fi

  python_types:
    name: Python type-check baseline
    if: contains(fromJSON('["OTS-Jarvis","TanDM"]'), github.event.repository.name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mypy
        run: python -m pip install --disable-pip-version-check 'mypy==1.18.2'
      - name: Report Python type-checking debt
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY" in
            ohanatechsolutions/OTS-Jarvis) target=jarvis ;;
            ohanatechsolutions/TanDM) target=tandm ;;
            *) echo 'Python type check N/A'; exit 0 ;;
          esac
          if mypy --follow-imports=skip --ignore-missing-imports --no-incremental "$target"; then
            echo "Mypy type-check PASS: $target" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mypy type-check DEBT/FAIL: $target; remediation needed before enabling this as a blocking release check." >> "$GITHUB_STEP_SUMMARY"
          fi

  dotnet:
    name: .NET build and test
    if: contains(fromJSON('["OTS-Security-Suite","Clipboard-History"]'), github.event.repository.name)
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test all eligible .NET projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = Get-ChildItem -Path . -Recurse -Filter '*.csproj' | Where-Object { $_.FullName -notmatch '[\\/](obj|bin)[\\/]' }
          if (-not $projects) { throw 'Expected .NET projects but none found' }
          foreach ($project in $projects) {
            dotnet build $project.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $($project.FullName)" }
          }
          foreach ($project in ($projects | Where-Object { $_.FullName -match '[\\/]tests[\\/]' })) {
            dotnet test $project.FullName --configuration Release --no-build
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $($project.FullName)" }
          }

  skill_audit:
    name: NVIDIA SkillSpector when applicable
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect skills
        id: skills
        shell: bash
        run: |
          if find . -path './.git' -prune -o -name SKILL.md -print -quit | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'NVIDIA SkillSpector: N/A — no SKILL.md found' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.skills.outputs.present == 'true'
        with:
          python-version: '3.13'
      - name: Install NVIDIA SkillSpector (static mode)
        if: steps.skills.outputs.present == 'true'
        run: python -m pip install 'git+https://github.com/NVIDIA/skillspector.git'
      - name: Audit each skill without external LLM
        if: steps.skills.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -name SKILL.md -print0 |
            while IFS= read -r -d '' file; do skillspector scan "$(dirname "$file")" --no-llm; done

  osv:
    name: OSV dependency and lockfile audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan available manifests without uploading artifacts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/github/workspace:ro" \
            -w /github/workspace \
            ghcr.io/google/osv-scanner-action:v2.7.1 --recursive ./

  policy:
    name: Agent sandbox and release applicability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record runtime and release requirements
        env:
          REPO: ${{ github.event.repository.name }}
        shell: bash
        run: |
          {
            echo '### OTS additional runtime security requirements'
            case "$REPO" in
              OTS-Jarvis)
                echo 'NVIDIA OpenShell: REQUIRED for autonomous agent execution. CI cannot prove runtime sandboxing; deployment gate remains UNVERIFIED.'
                ;;
              *) echo 'NVIDIA OpenShell: N/A unless autonomous agents are executed at runtime.' ;;
            esac
            case "$REPO" in
              OTS-Jarvis|OTS-Security-Suite|Clipboard-History|TanDM)
                echo 'Release artifact provenance and checksum verification: required in project-specific release pipelines; not verified by this repository-source scan.'
                ;;
              *) echo 'Release artifact verification: N/A (no compiled application release configured).' ;;
            esac
            echo 'OWASP ZAP: must run only against an isolated, authorized web test instance. This job does not scan production URLs.'
          } >> "$GITHUB_STEP_SUMMARY"
